<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Bedrock Music</title>
<meta name="description" content="Bedrock Music — artist management & development." />
<meta property="og:type" content="profile" />
<meta name="theme-color" content="#070707" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

<style>
  /* =========================================================
     BEDROCK — full artist page (mobile-first)
     One template for every artist. Everything shown comes from
     data.js: the artist's links, plus an optional `page` block
     (hero photo, featured release, tour, video, merch, sign-up,
     contacts). Any section without data is simply skipped.
     ========================================================= */
  :root {
    --bg: #070707;
    --card: #111111;
    --card-2: #171717;
    --line: #242424;
    --line-2: #343434;
    --text: #f4f4f4;
    --muted: #8d8d8d;
    --accent: #ff3355;          /* overridden per artist: page.accent */
    --accent-ink: #ffffff;
    --radius: 16px;
    --display: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --mono: "Space Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 16px; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--display); -webkit-font-smoothing: antialiased;
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
  }
  a { color: inherit; }
  img { display: block; max-width: 100%; }
  .wrap { max-width: 560px; margin: 0 auto; }
  .pad { padding: 0 16px; }

  /* ---------- Hero ---------- */
  .hero { position: relative; min-height: 78vh; min-height: 78svh; display: flex; align-items: flex-end; overflow: hidden; }
  .hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; filter: grayscale(1) contrast(1.08); }
  .hero.color .hero-img { filter: saturate(0.95) contrast(1.02); }
  .hero::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(7,7,7,0.55) 0%, rgba(7,7,7,0) 22%, rgba(7,7,7,0) 45%, rgba(7,7,7,0.85) 80%, var(--bg) 100%);
  }
  .hero-top { position: absolute; top: 0; left: 0; right: 0; z-index: 2; padding: calc(14px + env(safe-area-inset-top)) 16px 0; }
  .hero-top .wrap { display: flex; justify-content: space-between; align-items: center; }
  .back { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none; color: rgba(255,255,255,0.8); }
  .share-btn { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; background: rgba(0,0,0,0.35); color: #fff; border: 1px solid rgba(255,255,255,0.25); border-radius: 999px; padding: 7px 12px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .hero-body { position: relative; z-index: 2; width: 100%; padding: 0 16px 8px; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  .name { font-size: clamp(56px, 19vw, 96px); font-weight: 700; line-height: 0.88; letter-spacing: -0.02em; text-transform: uppercase; }
  .tagline { margin-top: 12px; font-size: 15px; color: #cfcfcf; line-height: 1.45; max-width: 420px; }
  .socials { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .socials a { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); color: #fff; transition: background .15s, border-color .15s; }
  .socials a:hover { background: rgba(255,255,255,0.16); }
  .socials svg { width: 18px; height: 18px; }

  /* Plain header when there is no hero photo */
  .hero.plain { min-height: auto; padding-top: 72px; }
  .hero.plain::after { display: none; }

  /* ---------- Sections ---------- */
  section.block { padding: 36px 16px 0; }
  .label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px 18px; border-radius: 12px; font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0.02em; text-decoration: none; border: 1px solid var(--line-2); background: var(--card-2); color: var(--text); cursor: pointer; transition: transform .1s, background .15s, border-color .15s; }
  .btn:active { transform: scale(0.985); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn svg { width: 18px; height: 18px; flex-shrink: 0; }

  /* Featured release */
  .release { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .release-top { display: flex; gap: 14px; padding: 14px; align-items: center; }
  .cover { width: 112px; height: 112px; border-radius: 10px; object-fit: cover; flex-shrink: 0; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .rel-kicker { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); }
  .rel-title { font-size: 22px; font-weight: 700; line-height: 1.1; margin-top: 6px; }
  .rel-sub { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .release-actions { padding: 0 14px 14px; display: grid; gap: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 9px 12px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--line); text-decoration: none; font-size: 13px; font-weight: 500; }
  .chip svg { width: 14px; height: 14px; }
  .embed-slot iframe { width: 100%; border: 0; border-radius: 12px; display: block; }

  /* Countdown */
  .countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 14px 14px; }
  .countdown div { background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; text-align: center; padding: 10px 0; }
  .countdown b { display: block; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .countdown span { font-family: var(--mono); font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }

  /* Tour */
  .tour-box { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 12px; }
  .tour-fallback { color: var(--muted); font-size: 14px; padding: 20px 4px; text-align: center; }
  .tour-more { margin-top: 10px; }
  .show { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
  .show:last-child { border-bottom: 0; }
  .show .d { width: 50px; flex-shrink: 0; text-align: center; border: 1px solid var(--line-2); border-radius: 10px; padding: 6px 0; }
  .show .d small { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
  .show .d b { display: block; font-size: 19px; line-height: 1.1; }
  .show .w { min-width: 0; flex: 1; }
  .show .w b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .show .w small { color: var(--muted); font-size: 13px; }
  .show .t { flex-shrink: 0; font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; padding: 9px 12px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .show .t.soldout { background: var(--card-2); color: var(--muted); border: 1px solid var(--line-2); }
  .tour-fallback a { color: var(--text); }

  /* Video (tap to load — keeps the page fast) */
  .video { position: relative; border-radius: var(--radius); overflow: hidden; background: #000; border: 1px solid var(--line); cursor: pointer; }
  .video.vertical { aspect-ratio: 9 / 16; max-width: 340px; margin: 0 auto; }
  .video.wide { aspect-ratio: 16 / 9; }
  .video img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; }
  .video .play { position: absolute; inset: 0; display: grid; place-items: center; }
  .video .play span { width: 64px; height: 64px; border-radius: 999px; background: var(--accent); display: grid; place-items: center; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
  .video .play svg { width: 24px; height: 24px; margin-left: 4px; color: var(--accent-ink); }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video-cap { font-size: 13px; color: var(--muted); margin-top: 10px; text-align: center; }

  /* Merch */
  .merch { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; text-decoration: none; }
  .merch .m-ico { width: 46px; height: 46px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line-2); display: grid; place-items: center; flex-shrink: 0; }
  .merch .m-ico svg { width: 22px; height: 22px; }
  .merch b { display: block; font-size: 16px; }
  .merch small { color: var(--muted); font-size: 13px; }
  .merch .chev { margin-left: auto; color: var(--muted); width: 18px; height: 18px; }

  /* Sign-up */
  .signup { background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 22%, var(--card)) 0%, var(--card) 60%); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .signup h3 { font-size: 20px; font-weight: 700; }
  .signup p { color: #c9c9c9; font-size: 14px; margin: 6px 0 14px; line-height: 1.45; }
  .signup input { width: 100%; padding: 15px 14px; border-radius: 12px; border: 1px solid var(--line-2); background: #0b0b0b; color: var(--text); font: 16px var(--display); margin-bottom: 10px; }
  .signup input:focus { outline: none; border-color: var(--accent); }
  .signup .fine { font-size: 11px; color: var(--muted); margin-top: 10px; }
  .signup .ok { font-weight: 700; padding: 8px 0; }
  .hp { position: absolute; left: -9999px; }

  /* All links */
  .group-title { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin: 18px 0 10px; }
  .group-title:first-child { margin-top: 0; }
  .row-link { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; text-decoration: none; font-size: 15px; font-weight: 500; margin-bottom: 8px; }
  .row-link svg { width: 18px; height: 18px; flex-shrink: 0; }
  .row-link .chev { margin-left: auto; color: var(--muted); width: 16px; height: 16px; }
  details.more summary { list-style: none; cursor: pointer; }
  details.more summary::-webkit-details-marker { display: none; }
  details.more[open] summary .btn-txt-closed, details.more:not([open]) summary .btn-txt-open { display: none; }
  details.more .more-body { margin-top: 14px; }

  /* Contacts */
  .contacts { display: grid; gap: 8px; }
  .contact { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; text-decoration: none; display: block; }
  .contact span { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .contact b { display: block; font-size: 15px; margin-top: 4px; }
  .contact small { color: var(--muted); font-size: 13px; }

  footer { text-align: center; padding: 44px 16px 12px; color: var(--muted); font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
  footer a { text-decoration: none; border-bottom: 1px solid var(--line-2); }

  /* Sticky bottom bar */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(7,7,7,0.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
  .dock .wrap { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
  .dock a { text-align: center; padding: 12px 6px; border-radius: 10px; text-decoration: none; font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; background: var(--card-2); border: 1px solid var(--line); }
  .dock a.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

  .notfound { text-align: center; padding: 120px 16px; color: var(--muted); }
  .notfound a { color: var(--text); }

  @media (min-width: 700px) {
    .hero { min-height: 640px; }
  }
</style>
</head>
<body>
  <main id="app"></main>

  <!-- Static copy of the sign-up form so Netlify Forms detects it at deploy time.
       The visible form is rendered by the script below and posts to the same name. -->
  <form name="fan-signup" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="fan-signup" />
    <input name="artist" /><input name="email" /><input name="city" /><input name="bot-field" />
  </form>

<script src="/data.js"></script>
<script>
(function () {
  const ICONS = window.BEDROCK_ICONS || {}, LABELS = window.BEDROCK_LABELS || {}, GROUPS = window.BEDROCK_GROUPS || {};
  const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
  const BAG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>';
  const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const icon = t => ICONS[t] || ICONS.default || "";
  const label = l => l.label || LABELS[l.type] || l.type;

  function slugFromLocation() {
    const q = new URLSearchParams(location.search).get("a");
    if (q) return q;
    const parts = location.pathname.split("/").filter(Boolean);
    return parts.length ? decodeURIComponent(parts[parts.length - 1]).replace(/\.html$/, "") : "";
  }

  const slug = slugFromLocation();
  const artist = ((window.BEDROCK && window.BEDROCK.roster) || []).find(a => a.slug === slug);
  const app = document.getElementById("app");

  if (!artist) {
    app.innerHTML = '<div class="notfound">Artist not found. <a href="/">Back to Bedrock Music</a></div>';
    return;
  }

  const P = artist.page || {};
  const links = artist.links || [];
  const byType = {}; links.forEach(l => { if (!byType[l.type]) byType[l.type] = l; });
  if (P.accent) document.documentElement.style.setProperty("--accent", P.accent);
  if (P.accentInk) document.documentElement.style.setProperty("--accent-ink", P.accentInk);

  document.title = artist.name + (P.tagline ? " — " + P.tagline : "") ;
  const metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) metaDesc.content = P.tagline || (artist.name + " — Bedrock Music");

  const html = [];
  const dock = [];

  /* ---------- Hero ---------- */
  const socialTypes = P.socials || ["instagram", "tiktok", "youtube", "spotify"];
  const socials = socialTypes.map(t => byType[t]).filter(Boolean)
    .map(l => '<a href="' + esc(l.url) + '" target="_blank" rel="noopener" aria-label="' + esc(label(l)) + '">' + icon(l.type) + "</a>").join("");
  html.push(
    '<header class="hero' + (P.hero ? "" : " plain") + (P.heroColor ? " color" : "") + '">' +
      (P.hero ? '<img class="hero-img" src="' + esc(P.hero) + '" alt="' + esc(artist.name) + '" fetchpriority="high"' + (P.heroPosition ? ' style="object-position:' + esc(P.heroPosition) + '"' : "") + ' />' : "") +
      '<div class="hero-top"><div class="wrap"><a class="back" href="/">Bedrock</a>' +
        '<button class="share-btn" id="share">Share</button></div></div>' +
      '<div class="hero-body"><div class="wrap">' +
        (P.location ? '<div class="eyebrow">' + esc(P.location) + "</div>" : "") +
        '<h1 class="name">' + esc(artist.name) + "</h1>" +
        (P.tagline ? '<p class="tagline">' + esc(P.tagline) + "</p>" : (artist.bio ? '<p class="tagline">' + esc(artist.bio) + "</p>" : "")) +
        (socials ? '<div class="socials">' + socials + "</div>" : "") +
      "</div></div>" +
    "</header>"
  );

  /* ---------- Featured release ---------- */
  const F = P.featured;
  if (F) {
    const rd = F.releaseDate ? new Date(F.releaseDate) : null;
    const upcoming = rd && rd > new Date();
    const fl = F.links || [];
    const main = fl[0];
    const rest = fl.slice(1);
    html.push(
      '<section class="block" id="listen"><div class="wrap">' +
      '<div class="label">' + (upcoming ? "Coming soon" : "Listen") + "</div>" +
      '<div class="release">' +
        '<div class="release-top">' +
          (F.cover ? '<img class="cover" src="' + esc(F.cover) + '" alt="' + esc(F.title) + ' cover" />' : "") +
          "<div>" +
            '<div class="rel-kicker">' + esc(upcoming ? "Out " + rd.toLocaleDateString(undefined, { month: "short", day: "numeric" }) : (F.kicker || "Out now")) + "</div>" +
            '<div class="rel-title">' + esc(F.title) + "</div>" +
            (F.subtitle ? '<div class="rel-sub">' + esc(F.subtitle) + "</div>" : "") +
          "</div>" +
        "</div>" +
        (upcoming ? '<div class="countdown" id="cd"><div><b data-u="d">0</b><span>Days</span></div><div><b data-u="h">0</b><span>Hrs</span></div><div><b data-u="m">0</b><span>Min</span></div><div><b data-u="s">0</b><span>Sec</span></div></div>' : "") +
        '<div class="release-actions">' +
          (upcoming && F.presaveUrl ? '<a class="btn primary" href="' + esc(F.presaveUrl) + '" target="_blank" rel="noopener">Pre-save</a>' : "") +
          (!upcoming && main ? '<a class="btn primary" href="' + esc(main.url) + '" target="_blank" rel="noopener">' + icon(main.type) + "<span>Listen on " + esc(label(main)) + "</span></a>" : "") +
          (!upcoming && rest.length ? '<div class="chips">' + rest.map(l => '<a class="chip" href="' + esc(l.url) + '" target="_blank" rel="noopener">' + icon(l.type) + esc(label(l)) + "</a>").join("") + "</div>" : "") +
          (!upcoming && F.spotifyEmbed ? '<button class="btn" id="play-here">' + PLAY + "<span>Play it here</span></button><div class=\"embed-slot\" id=\"embed-slot\"></div>" : "") +
        "</div>" +
      "</div></div></section>"
    );
    dock.push({ href: "#listen", text: upcoming ? "Pre-save" : "Listen" });

    if (upcoming) {
      const tick = () => {
        const ms = Math.max(0, rd - new Date());
        const v = { d: Math.floor(ms / 864e5), h: Math.floor(ms / 36e5) % 24, m: Math.floor(ms / 6e4) % 60, s: Math.floor(ms / 1e3) % 60 };
        document.querySelectorAll("#cd b").forEach(b => { b.textContent = String(v[b.dataset.u]).padStart(2, "0"); });
        if (ms === 0) location.reload();
      };
      setTimeout(() => { tick(); setInterval(tick, 1000); }, 0);
    }
  }

  /* ---------- Tour ---------- */
  const T = P.tour;
  if (T) {
    html.push(
      '<section class="block" id="tour"><div class="wrap">' +
      '<div class="label">Tour</div>' +
      '<div class="tour-box" id="tour-box">' +
        '<div class="tour-fallback" id="tour-status">Loading dates\u2026</div>' +
      "</div>" +
      (byType.bandsintown ? '<a class="btn tour-more" href="' + esc(byType.bandsintown.url) + '" target="_blank" rel="noopener">' + icon("bandsintown") + "<span>All dates &amp; track " + esc(artist.name) + "</span></a>" : "") +
      "</div></section>"
    );
    dock.push({ href: "#tour", text: "Tour" });
  }

  /* ---------- Video ---------- */
  const V = P.video;
  if (V && V.youtubeId) {
    const vertical = V.vertical !== false && V.shape !== "wide";
    html.push(
      '<section class="block" id="watch"><div class="wrap">' +
      '<div class="label">Watch</div>' +
      '<div class="video ' + (vertical ? "vertical" : "wide") + '" id="video" data-id="' + esc(V.youtubeId) + '">' +
        '<img src="https://i.ytimg.com/vi/' + esc(V.youtubeId) + '/' + (vertical ? "oardefault" : "hqdefault") + '.jpg" alt="" loading="lazy" onerror="this.onerror=null;this.src=\'https://i.ytimg.com/vi/' + esc(V.youtubeId) + '/hqdefault.jpg\'" />' +
        '<div class="play"><span>' + PLAY + "</span></div>" +
      "</div>" +
      (V.caption ? '<div class="video-cap">' + esc(V.caption) + "</div>" : "") +
      "</div></section>"
    );
  }

  /* ---------- Merch ---------- */
  const M = P.merch || (byType.merch ? { url: byType.merch.url } : null);
  if (M && M.url) {
    html.push(
      '<section class="block" id="merch"><div class="wrap">' +
      '<div class="label">Merch</div>' +
      '<a class="merch" href="' + esc(M.url) + '" target="_blank" rel="noopener">' +
        '<div class="m-ico">' + BAG + "</div>" +
        "<div><b>" + esc(M.title || "Shop merch") + "</b><small>" + esc(M.subtitle || "Official store") + "</small></div>" + CHEV +
      "</a></div></section>"
    );
    dock.push({ href: "#merch", text: "Merch" });
  }

  /* ---------- Sign-up ---------- */
  const S = P.signup;
  if (S) {
    html.push(
      '<section class="block" id="join"><div class="wrap"><div class="signup">' +
        "<h3>" + esc(S.title || "Get on the list") + "</h3>" +
        "<p>" + esc(S.text || "New music, shows near you, and first dibs on tickets.") + "</p>" +
        '<form id="signup-form" novalidate>' +
          '<input type="email" name="email" placeholder="Email" autocomplete="email" required />' +
          (S.askCity !== false ? '<input type="text" name="city" placeholder="City (so we know where to play)" autocomplete="address-level2" />' : "") +
          '<p class="hp"><label>Leave empty <input name="bot-field" tabindex="-1" autocomplete="off" /></label></p>' +
          '<button class="btn primary" type="submit">Join</button>' +
          '<div class="fine">No spam. Unsubscribe anytime.</div>' +
        "</form>" +
      "</div></div></section>"
    );
    dock.push({ href: "#join", text: "Join" });
  }

  /* ---------- Everything else ---------- */
  const groupHtml = Object.keys(GROUPS).map(section => {
    const items = GROUPS[section].map(t => byType[t]).filter(Boolean);
    if (!items.length) return "";
    return '<div class="group-title">' + esc(section) + "</div>" +
      items.map(l => '<a class="row-link" href="' + esc(l.url) + '" target="_blank" rel="noopener">' + icon(l.type) + "<span>" + esc(label(l)) + "</span>" + CHEV + "</a>").join("");
  }).join("");
  if (groupHtml) {
    html.push(
      '<section class="block" id="links"><div class="wrap">' +
      '<div class="label">Everywhere</div>' +
      '<details class="more"><summary><span class="btn"><span class="btn-txt-closed">All platforms &amp; socials</span><span class="btn-txt-open">Hide</span></span></summary>' +
      '<div class="more-body">' + groupHtml + "</div></details>" +
      "</div></section>"
    );
  }

  /* ---------- Contacts ---------- */
  const C = P.contacts || [];
  if (C.length || P.pressUrl) {
    html.push(
      '<section class="block" id="contact"><div class="wrap">' +
      '<div class="label">Contact</div><div class="contacts">' +
      C.map(c => '<a class="contact" href="mailto:' + esc(c.email) + '"><span>' + esc(c.role) + "</span><b>" + esc(c.name) + "</b><small>" + esc(c.email) + "</small></a>").join("") +
      (P.pressUrl ? '<a class="contact" href="' + esc(P.pressUrl) + '"><span>Press &amp; industry</span><b>Electronic press kit</b><small>Bio, photos, fact sheet &rarr;</small></a>' : "") +
      "</div></div></section>"
    );
  }

  html.push('<footer><a href="/">Bedrock Music</a> &middot; &copy; ' + new Date().getFullYear() + "</footer>");

  if (dock.length) {
    dock[0].primary = true;
    html.push('<nav class="dock"><div class="wrap">' + dock.slice(0, 4).map(d => '<a href="' + d.href + '"' + (d.primary ? ' class="primary"' : "") + ">" + esc(d.text) + "</a>").join("") + "</div></nav>");
  }

  app.innerHTML = html.join("");

  /* ---------- Behaviour ---------- */
  const share = document.getElementById("share");
  share.addEventListener("click", async () => {
    const data = { title: artist.name, url: location.href };
    try {
      if (navigator.share) await navigator.share(data);
      else { await navigator.clipboard.writeText(location.href); share.textContent = "Copied"; setTimeout(() => (share.textContent = "Share"), 1600); }
    } catch (e) { /* cancelled */ }
  });

  const playHere = document.getElementById("play-here");
  if (playHere) playHere.addEventListener("click", () => {
    document.getElementById("embed-slot").innerHTML =
      '<iframe src="' + esc(F.spotifyEmbed) + '" height="352" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" title="Spotify player"></iframe>';
    playHere.remove();
  });

  const video = document.getElementById("video");
  if (video) video.addEventListener("click", () => {
    video.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + esc(video.dataset.id) + '?autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Video"></iframe>';
  }, { once: true });

  /* Tour dates: pulled live from Bandsintown, so they update themselves when
     dates are added there. Rendered in this page's own style. */
  if (T) {
    const status = document.getElementById("tour-status");
    const box = document.getElementById("tour-box");
    const none = () => {
      status.innerHTML = "No dates announced yet." + (S ? ' <a href="#join">Get notified first</a>.' : "");
    };
    if (!(T.bandsintownId && T.bandsintownAppId)) none();
    else {
      const cb = "bitDates_" + Date.now();
      const timer = setTimeout(none, 8000);
      window[cb] = (events) => {
        clearTimeout(timer);
        const list = (Array.isArray(events) ? events : []).slice(0, T.limit || 12);
        if (!list.length) return none();
        box.innerHTML = list.map(ev => {
          const d = new Date(ev.datetime);
          const v = ev.venue || {};
          const where = [v.city, v.region || v.country].filter(Boolean).join(", ");
          const offer = (ev.offers || []).find(o => o.url) || {};
          const sold = ev.sold_out || offer.status === "sold out";
          return '<div class="show"><div class="d"><small>' + d.toLocaleDateString("en-US", { month: "short" }) + "</small><b>" + d.getDate() + "</b></div>" +
            '<div class="w"><b>' + esc(where || v.name) + "</b><small>" + esc(v.name || "") + "</small></div>" +
            '<a class="t' + (sold ? " soldout" : "") + '" href="' + esc(offer.url || ev.url) + '" target="_blank" rel="noopener">' + (sold ? "Sold out" : "Tickets") + "</a></div>";
        }).join("");
      };
      const s = document.createElement("script");
      s.src = "https://rest.bandsintown.com/V4/artists/" + encodeURIComponent(T.bandsintownId) + "/events/?app_id=" + encodeURIComponent(T.bandsintownAppId) + "&callback=" + cb;
      s.onerror = none;
      document.body.appendChild(s);
    }
  }

  const form = document.getElementById("signup-form");
  if (form) form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = form.email.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { form.email.focus(); form.email.style.borderColor = "var(--accent)"; return; }
    const body = new URLSearchParams({ "form-name": "fan-signup", artist: artist.name, email, city: form.city ? form.city.value.trim() : "", "bot-field": form["bot-field"].value });
    const btn = form.querySelector("button"); btn.disabled = true; btn.textContent = "Joining…";
    try {
      const r = await fetch("/", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body.toString() });
      if (!r.ok) throw new Error(r.status);
      form.innerHTML = '<div class="ok">You’re on the list. See you soon.</div>';
    } catch (err) {
      btn.disabled = false; btn.textContent = "Try again";
    }
  });
})();
</script>
</body>
</html>
