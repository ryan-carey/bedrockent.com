<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bedrock Music</title>
<meta name="description" content="Bedrock Music — artist management & development." />

<!-- Open Graph / social previews -->
<meta property="og:title" content="Bedrock Music" />
<meta property="og:description" content="Bedrock Music — artist management & development." />
<meta property="og:type" content="website" />

<style>
  /* =========================================================
     BEDROCK MUSIC — link in bio (home hub)
     Content lives in data.js (window.BEDROCK). Edit that file to
     add artists, links, or bios. Each artist name links to its
     own page at /{slug}.
     ========================================================= */
  :root {
    --bg: #0a0a0a;
    --bg-card: #141414;
    --border: #262626;
    --border-hover: #3a3a3a;
    --text: #f5f5f5;
    --text-muted: #888888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  body {
    background:
      radial-gradient(ellipse at top, rgba(255,255,255,0.04) 0%, transparent 50%),
      var(--bg);
    background-attachment: fixed;
  }
  .container { max-width: 560px; margin: 0 auto; padding: 56px 20px 80px; }

  header { text-align: center; margin-bottom: 48px; }
  .logo-slot { margin: 0 auto 20px; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; }
  .logo-img { max-width: 100%; max-height: 100%; display: none; }
  .logo-text {
    font-size: 28px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase;
    background: linear-gradient(180deg, #ffffff 0%, #b0b0b0 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .tagline { color: var(--text-muted); font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; margin-top: 8px; }

  .section-label {
    font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--text-muted); margin: 36px 0 14px; padding-left: 4px;
  }

  .card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 18px 14px; margin-bottom: 14px;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .card:hover { border-color: var(--border-hover); }

  /* Artist name is now a link to the artist's page. */
  .card-name {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 17px; font-weight: 700; letter-spacing: 0.04em;
    margin-bottom: 12px; color: var(--text); text-decoration: none;
  }
  a.card-name .arrow { color: var(--text-muted); width: 15px; height: 15px; transition: transform 0.15s ease, color 0.15s ease; }
  a.card-name:hover .arrow { transform: translateX(3px); color: var(--text); }
  a.card-name:hover .name-text { text-decoration: underline; text-underline-offset: 3px; }

  .links-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .link-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px;
    background: #1f1f1f; border: 1px solid var(--border); border-radius: 999px;
    color: var(--text); text-decoration: none; font-size: 13px; font-weight: 500; letter-spacing: 0.02em;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .link-btn:hover { background: #2a2a2a; border-color: #4a4a4a; }
  .link-btn:active { transform: scale(0.97); }
  .link-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

  .view-all {
    display: inline-block; margin-top: 12px; font-size: 12px; letter-spacing: 0.04em;
    color: var(--text-muted); text-decoration: none;
  }
  .view-all:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }

  footer { text-align: center; margin-top: 56px; color: var(--text-muted); font-size: 12px; letter-spacing: 0.08em; }
  footer a { color: var(--text-muted); text-decoration: none; border-bottom: 1px solid #2a2a2a; padding-bottom: 1px; }
  footer a:hover { color: var(--text); }

  @media (max-width: 480px) {
    .container { padding: 40px 16px 60px; }
    .logo-text { font-size: 24px; }
    .card { padding: 16px 14px 12px; }
  }
</style>
</head>

<body>
  <div class="container">
    <header>
      <div class="logo-slot">
        <img class="logo-img" id="logo-img" alt="Bedrock Music" src="" />
        <span class="logo-text" id="logo-text">BEDROCK</span>
      </div>
      <div class="tagline" id="tagline">Music · Management</div>
    </header>

    <main id="content"></main>

    <footer><p>&copy; <span id="year"></span> Bedrock Music</p></footer>
  </div>

<script src="data.js"></script>
<script>
  const ICONS = window.BEDROCK_ICONS, LABELS = window.BEDROCK_LABELS;

  function buildLinkBtn(link) {
    const a = document.createElement("a");
    a.className = "link-btn";
    a.href = link.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.innerHTML = (ICONS[link.type] || ICONS.default) + "<span>" + (link.label || LABELS[link.type] || link.type) + "</span>";
    return a;
  }

  function buildCard(item) {
    const card = document.createElement("div");
    card.className = "card";

    // Name — links to the artist page when the item has a slug.
    let name;
    if (item.slug) {
      name = document.createElement("a");
      name.className = "card-name";
      name.href = "/" + item.slug;
      name.innerHTML = '<span class="name-text">' + item.name + '</span>'
        + '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
    } else {
      name = document.createElement("div");
      name.className = "card-name";
      name.textContent = item.name;
    }
    card.appendChild(name);

    // Show only the primary links on the hub (fall back to all if none flagged).
    const primary = item.links.filter(l => l.primary);
    const shown = primary.length ? primary : item.links;
    const row = document.createElement("div");
    row.className = "links-row";
    shown.forEach(l => row.appendChild(buildLinkBtn(l)));
    card.appendChild(row);

    if (item.slug) {
      const more = document.createElement("a");
      more.className = "view-all";
      more.href = "/" + item.slug;
      more.textContent = "View all links →";
      card.appendChild(more);
    }
    return card;
  }

  function buildSection(label, items) {
    if (!items || !items.length) return null;
    const wrap = document.createDocumentFragment();
    const lbl = document.createElement("div");
    lbl.className = "section-label"; lbl.textContent = label;
    wrap.appendChild(lbl);
    items.forEach(i => wrap.appendChild(buildCard(i)));
    return wrap;
  }

  document.addEventListener("DOMContentLoaded", () => {
    const B = window.BEDROCK;
    document.getElementById("logo-text").textContent = B.brand.name;
    document.getElementById("tagline").textContent = B.brand.tagline;
    if (B.brand.logoImage) {
      const img = document.getElementById("logo-img");
      img.src = B.brand.logoImage; img.style.display = "block";
      document.getElementById("logo-text").style.display = "none";
    }
    const content = document.getElementById("content");
    const roster = buildSection("Roster", B.roster);
    if (roster) content.appendChild(roster);
    const ventures = buildSection("Ventures", B.ventures);
    if (ventures) content.appendChild(ventures);
    document.getElementById("year").textContent = new Date().getFullYear();
  });
</script>
</body>
</html>
