<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Press kit — Bedrock Music</title>
<meta name="description" content="Electronic press kit — Bedrock Music." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#f6f4ef" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
<style>
  /* =========================================================
     BEDROCK — electronic press kit (one template, every artist)
     Reads the artist's `press` block from data.js. Live at
     /press/<slug>. Any section without data is skipped.
     ========================================================= */
  :root {
    --paper: #f6f4ef;
    --card: #ffffff;
    --ink: #121212;
    --ink-2: #3c3a36;
    --muted: #77736b;
    --rule: #dedad1;
    --rule-soft: #ebe8e1;
    --accent: #ff3355;      /* press.accent */
    --accent-ink: #ffffff;  /* press.accentInk */
    --accent-deep: #b3122f; /* press.accentDeep — accent dark enough for text on paper */
    --display: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --mono: "Space Mono", ui-monospace, Menlo, monospace;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 64px; }
  body { background: var(--paper); color: var(--ink); font-family: var(--display); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  img { display: block; max-width: 100%; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }

  /* ---------- Top bar ---------- */
  .bar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule); }
  .bar .wrap { display: flex; align-items: center; gap: 18px; height: 52px; }
  .bar .brand { font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; text-decoration: none; white-space: nowrap; }
  .bar nav { display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; margin-left: auto; }
  .bar nav::-webkit-scrollbar { display: none; }
  .bar nav a { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; color: var(--muted); white-space: nowrap; padding: 6px 0; }
  .bar nav a:hover { color: var(--ink); }

  /* ---------- Hero ---------- */
  .hero { padding: 28px 0 0; }
  .hero-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 32px; align-items: end; }
  .hero-photo { aspect-ratio: 4 / 5; border-radius: 4px; overflow: hidden; background: var(--rule-soft); }
  .hero-photo img { width: 100%; height: 100%; object-fit: cover; }
  .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 14px; }
  h1 { font-size: clamp(64px, 12vw, 132px); font-weight: 700; line-height: 0.86; letter-spacing: -0.035em; text-transform: uppercase; }
  .fullname { font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-top: 14px; }
  .oneliner { font-family: var(--serif); font-size: clamp(20px, 2.4vw, 26px); line-height: 1.32; margin-top: 22px; color: var(--ink-2); max-width: 30ch; }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 16px; border-radius: 999px; font: 700 13px var(--display); letter-spacing: 0.02em; text-decoration: none; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn svg { width: 16px; height: 16px; }
  .updated { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-top: 22px; }

  /* ---------- Stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); margin-top: 36px; }
  .stat { padding: 18px 16px 18px 0; }
  .stat + .stat { padding-left: 16px; border-left: 1px solid var(--rule); }
  .stat b { display: block; font-size: clamp(30px, 4.4vw, 46px); font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat span { display: block; margin-top: 8px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); line-height: 1.5; }

  /* ---------- Sections ---------- */
  section.block { padding: 56px 0 0; }
  .label { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-top: 1px solid var(--ink); padding-top: 12px; margin-bottom: 22px; }
  .label h2 { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; }
  .label .tool { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; background: none; border: 1px solid var(--rule); border-radius: 999px; padding: 6px 10px; cursor: pointer; color: var(--ink-2); }
  .label .tool:hover { border-color: var(--ink); }

  /* Bio */
  .bio-grid { display: grid; grid-template-columns: 280px 1fr; gap: 40px; }
  .short { font-family: var(--serif); font-size: 18px; line-height: 1.5; color: var(--ink-2); }
  .short-tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .copy-mini { background: none; border: 0; cursor: pointer; font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
  .long p { font-family: var(--serif); font-size: 19px; line-height: 1.62; max-width: 64ch; }
  .long p + p { margin-top: 1em; }
  .long p:first-child::first-letter { font-family: var(--display); font-weight: 700; float: left; font-size: 3.3em; line-height: 0.82; padding: 6px 10px 0 0; color: var(--accent-deep); }

  /* Quotes */
  .quotes { display: grid; gap: 18px; }
  blockquote { background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--accent); border-radius: 4px; padding: 22px 24px; }
  blockquote p { font-family: var(--serif); font-size: clamp(22px, 3vw, 30px); line-height: 1.3; font-style: italic; }
  blockquote footer { margin-top: 12px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  blockquote footer b { color: var(--ink); }
  blockquote footer a { text-decoration: none; border-bottom: 1px solid var(--rule); }

  /* Highlights */
  .timeline { list-style: none; }
  .timeline li { display: grid; grid-template-columns: 150px 1fr; gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--rule-soft); }
  .timeline li:first-child { padding-top: 0; }
  .timeline .when { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); padding-top: 3px; }
  .timeline .what { font-size: 16px; line-height: 1.45; }

  /* Music */
  .music { display: grid; grid-template-columns: 300px 1fr; gap: 32px; align-items: start; }
  .music .cover { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; box-shadow: 0 14px 40px rgba(0,0,0,0.14); }
  .rel-title { font-size: clamp(28px, 3.6vw, 40px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.02; }
  .rel-meta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: 10px; }
  .tracks { list-style: none; counter-reset: t; margin-top: 20px; border-top: 1px solid var(--rule); }
  .tracks li { counter-increment: t; display: flex; gap: 14px; align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--rule-soft); font-size: 16px; }
  .tracks li::before { content: counter(t, decimal-leading-zero); font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .tracks .focus { margin-left: auto; font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); padding: 3px 7px; border-radius: 999px; }
  .embed-slot { margin-top: 18px; }
  .embed-slot iframe { width: 100%; border: 0; border-radius: 12px; display: block; }
  .also { margin-top: 26px; }
  .also h3 { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 400; margin-bottom: 8px; }
  .also a { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--rule-soft); text-decoration: none; font-size: 15px; }
  .also a small { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .also a:hover b { color: var(--accent-deep); }
  .also b { font-weight: 500; }

  /* Video */
  .videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .vid figure { margin: 0; }
  .video { position: relative; border-radius: 6px; overflow: hidden; background: #000; cursor: pointer; aspect-ratio: 9 / 16; }
  .video.wide { aspect-ratio: 16 / 9; }
  .video img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }
  .video .play { position: absolute; inset: 0; display: grid; place-items: center; }
  .video .play span { width: 56px; height: 56px; border-radius: 999px; background: var(--accent); display: grid; place-items: center; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
  .video .play svg { width: 22px; height: 22px; margin-left: 3px; color: var(--accent-ink); }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .vid figcaption { font-size: 14px; color: var(--ink-2); margin-top: 10px; line-height: 1.4; }

  /* Photos */
  .photos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .photo { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
  .photo .ph { aspect-ratio: 3 / 2; background: var(--rule-soft); }
  .photo .ph img { width: 100%; height: 100%; object-fit: cover; }
  .photo .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 14px; }
  .photo .meta span { font-size: 13px; color: var(--ink-2); }
  .dl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; border: 1px solid var(--ink); border-radius: 999px; padding: 6px 10px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .dl:hover { background: var(--ink); color: var(--paper); }
  .dl svg { width: 12px; height: 12px; }
  .credit { font-size: 12px; color: var(--muted); margin-top: 12px; }
  .assets { margin-top: 18px; display: grid; gap: 8px; }
  .asset { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 14px; background: var(--card); border: 1px solid var(--rule); border-radius: 6px; }
  .asset b { font-weight: 500; font-size: 15px; display: block; }
  .asset small { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

  /* Facts + coverage */
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .facts { display: grid; }
  .facts div { display: grid; grid-template-columns: 130px 1fr; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--rule-soft); }
  .facts dt { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
  .facts dd { font-size: 15px; line-height: 1.4; }
  .coverage a { display: block; padding: 12px 0; border-bottom: 1px solid var(--rule-soft); text-decoration: none; }
  .coverage small { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 4px; }
  .coverage span { font-size: 15px; line-height: 1.4; }
  .coverage a:hover span { text-decoration: underline; text-underline-offset: 3px; }

  /* Links + contacts */
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .links a { display: inline-flex; align-items: center; gap: 8px; padding: 9px 13px; border-radius: 999px; border: 1px solid var(--rule); background: var(--card); text-decoration: none; font-size: 13px; font-weight: 500; }
  .links a:hover { border-color: var(--ink); }
  .links svg { width: 14px; height: 14px; }
  .contacts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .contact { display: block; text-decoration: none; background: var(--ink); color: var(--paper); border-radius: 6px; padding: 18px; }
  .contact span { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); }
  .contact b { display: block; font-size: 19px; margin-top: 6px; }
  .contact small { display: block; font-size: 14px; opacity: 0.75; margin-top: 4px; }

  footer.site { text-align: center; padding: 56px 16px 28px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  footer.site a { text-decoration: none; border-bottom: 1px solid var(--rule); }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: var(--paper); font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; padding: 10px 14px; border-radius: 999px; transition: all .2s; pointer-events: none; z-index: 30; }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .notfound { text-align: center; padding: 120px 16px; color: var(--muted); }

  @media (max-width: 820px) {
    .hero-grid, .bio-grid, .music, .two { grid-template-columns: 1fr; gap: 26px; }
    .hero-photo { aspect-ratio: 4 / 3; order: -1; }
    .music .cover { max-width: 260px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat:nth-child(3) { padding-left: 0; border-left: 0; }
    .stat:nth-child(n+3) { border-top: 1px solid var(--rule); }
    .timeline li { grid-template-columns: 1fr; gap: 4px; }
    .photos { grid-template-columns: 1fr; }
    .videos { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .long p { font-size: 18px; }
  }
  @media print {
    .bar, .hero-actions, .tool, .dl, .embed-slot, .videos, .toast, #play-here { display: none !important; }
    body { background: #fff; }
    section.block { padding-top: 28px; break-inside: avoid-page; }
    .photos { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>
  <main id="app"></main>
  <div class="toast" id="toast">Copied</div>

<script src="/data.js"></script>
<script>
(function () {
  const ICONS = window.BEDROCK_ICONS || {};
  const LABELS = window.BEDROCK_LABELS || {};
  const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>';
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const icon = t => ICONS[t] || ICONS.default || "";
  const label = l => l.label || LABELS[l.type] || l.type;
  const fileName = u => decodeURIComponent(String(u).split("/").pop().split("?")[0]);

  function slugFromLocation() {
    const q = new URLSearchParams(location.search).get("a");
    if (q) return q;
    const parts = location.pathname.split("/").filter(Boolean);
    return parts.length ? decodeURIComponent(parts[parts.length - 1]).replace(/\.html$/, "") : "";
  }

  const slug = slugFromLocation();
  const artist = ((window.BEDROCK && window.BEDROCK.roster) || []).find(a => a.slug === slug);
  const app = document.getElementById("app");
  if (!artist || !artist.press) {
    app.innerHTML = '<div class="notfound">No press kit here yet. <a href="/">Back to Bedrock Music</a></div>';
    return;
  }

  const K = artist.press;
  const links = artist.links || [];
  const byType = {}; links.forEach(l => { if (!byType[l.type]) byType[l.type] = l; });
  const root = document.documentElement.style;
  if (K.accent) root.setProperty("--accent", K.accent);
  if (K.accentInk) root.setProperty("--accent-ink", K.accentInk);
  if (K.accentDeep) root.setProperty("--accent-deep", K.accentDeep);

  document.title = artist.name + " — Press kit";
  const md = document.querySelector('meta[name="description"]');
  if (md) md.content = K.oneLiner || K.shortBio || (artist.name + " press kit");

  const nav = [];
  const html = [];
  const section = (id, title, body, tool) => {
    nav.push({ id, title });
    return '<section class="block" id="' + id + '"><div class="wrap">' +
      '<div class="label"><h2>' + esc(title) + "</h2>" + (tool || "") + "</div>" + body + "</div></section>";
  };

  /* ---------- Hero ---------- */
  const pageLink = artist.page ? "/preview/" + artist.slug : "/" + artist.slug;
  html.push(
    '<header class="hero"><div class="wrap"><div class="hero-grid">' +
      "<div>" +
        '<div class="kicker">Electronic press kit' + (K.genre ? " &middot; " + esc(K.genre) : "") + (K.location ? " &middot; " + esc(K.location) : "") + "</div>" +
        "<h1>" + esc(artist.name) + "</h1>" +
        (K.fullName && K.fullName !== artist.name ? '<div class="fullname">' + esc(K.fullName) + "</div>" : "") +
        (K.oneLiner ? '<p class="oneliner">' + esc(K.oneLiner) + "</p>" : "") +
        '<div class="hero-actions">' +
          ((K.contacts || [])[0] ? '<a class="btn primary" href="mailto:' + esc(K.contacts[0].email) + "?subject=" + encodeURIComponent(artist.name + " — press inquiry") + '">Press inquiries</a>' : "") +
          ((K.photos || []).length ? '<a class="btn" href="#photos">Photos</a>' : "") +
          (K.music && K.music.listen ? '<a class="btn" href="' + esc(K.music.listen) + '" target="_blank" rel="noopener">Listen</a>' : "") +
        "</div>" +
        (K.updated ? '<div class="updated">Updated ' + esc(K.updated) + "</div>" : "") +
      "</div>" +
      (K.hero ? '<div class="hero-photo"><img src="' + esc(K.hero) + '" alt="' + esc(artist.name) + '" fetchpriority="high"' + (K.heroPosition ? ' style="object-position:' + esc(K.heroPosition) + '"' : "") + " /></div>" : "") +
    "</div>" +
    ((K.stats || []).length ? '<div class="stats">' + K.stats.slice(0, 4).map(s => '<div class="stat"><b>' + esc(s.value) + "</b><span>" + esc(s.label) + "</span></div>").join("") + "</div>" : "") +
    "</div></header>"
  );

  /* ---------- Bio ---------- */
  const bio = K.bio || [];
  if (bio.length || K.shortBio) {
    html.push(section("bio", "Bio",
      '<div class="bio-grid">' +
        (K.shortBio ? '<div><div class="short-tag"><span>Short bio</span><button class="copy-mini" data-copy="short">Copy</button></div><p class="short">' + esc(K.shortBio) + "</p></div>" : "<div></div>") +
        '<div class="long">' + bio.map(p => "<p>" + esc(p) + "</p>").join("") + "</div>" +
      "</div>",
      bio.length ? '<button class="tool" data-copy="long">Copy full bio</button>' : ""));
  }

  /* ---------- Quotes ---------- */
  if ((K.quotes || []).length) {
    html.push(section("praise", "Praise",
      '<div class="quotes">' + K.quotes.map(q =>
        "<blockquote><p>&ldquo;" + esc(q.text) + "&rdquo;</p><footer><b>" + esc(q.by) + "</b>" +
        (q.where ? " &middot; " + (q.url ? '<a href="' + esc(q.url) + '" target="_blank" rel="noopener">' + esc(q.where) + "</a>" : esc(q.where)) : "") +
        "</footer></blockquote>").join("") + "</div>"));
  }

  /* ---------- Highlights ---------- */
  if ((K.highlights || []).length) {
    html.push(section("highlights", "Highlights",
      '<ol class="timeline">' + K.highlights.map(h => '<li><div class="when">' + esc(h.when) + '</div><div class="what">' + esc(h.what) + "</div></li>").join("") + "</ol>"));
  }

  /* ---------- Music ---------- */
  const M = K.music;
  if (M) {
    html.push(section("music", "Music",
      '<div class="music">' +
        (M.cover ? '<img class="cover" src="' + esc(M.cover) + '" alt="' + esc(M.title) + ' artwork" loading="lazy" />' : "<div></div>") +
        "<div>" +
          '<div class="rel-title">' + esc(M.title) + "</div>" +
          (M.meta ? '<div class="rel-meta">' + esc(M.meta) + "</div>" : "") +
          ((M.tracks || []).length ? '<ol class="tracks">' + M.tracks.map(t => "<li>" + esc(t) + (t === M.focus ? '<span class="focus">Focus track</span>' : "") + "</li>").join("") + "</ol>" : "") +
          (M.spotifyEmbed ? '<div class="embed-slot" id="embed-slot"><button class="btn primary" id="play-here">' + PLAY.replace("<svg", '<svg width="16" height="16"') + "<span>Play it here</span></button></div>" : "") +
          ((M.also || []).length ? '<div class="also"><h3>Also</h3>' + M.also.map(a => '<a href="' + esc(a.url) + '" target="_blank" rel="noopener"><b>' + esc(a.title) + "</b><small>" + esc(a.meta || "") + "</small></a>").join("") + "</div>" : "") +
        "</div>" +
      "</div>"));
  }

  /* ---------- Video ---------- */
  const V = (K.videos || []).filter(v => v.youtubeId);
  if (V.length) {
    html.push(section("video", "Video",
      '<div class="videos">' + V.map(v =>
        '<div class="vid"><figure><div class="video' + (v.vertical === false ? " wide" : "") + '" data-id="' + esc(v.youtubeId) + '">' +
          '<img src="https://i.ytimg.com/vi/' + esc(v.youtubeId) + '/hqdefault.jpg" alt="" loading="lazy" />' +
          '<div class="play"><span>' + PLAY + "</span></div></div>" +
          (v.title ? "<figcaption>" + esc(v.title) + "</figcaption>" : "") +
        "</figure></div>").join("") + "</div>"));
  }

  /* ---------- Photos & assets ---------- */
  const PH = K.photos || [];
  const AS = K.assets || [];
  if (PH.length || AS.length) {
    html.push(section("photos", "Photos & assets",
      (PH.length ? '<div class="photos">' + PH.map(p =>
        '<div class="photo"><div class="ph"><img src="' + esc(p.src) + '" alt="' + esc(artist.name + (p.caption ? " — " + p.caption : "")) + '" loading="lazy" /></div>' +
        '<div class="meta"><span>' + esc(p.caption || "") + '</span><a class="dl" href="' + esc(p.full || p.src) + '" download="' + esc(fileName(p.full || p.src)) + '">' + DL + "Hi-res</a></div></div>").join("") + "</div>" : "") +
      (K.photoCredit ? '<p class="credit">' + esc(K.photoCredit) + "</p>" : "") +
      (AS.length ? '<div class="assets">' + AS.map(a =>
        '<div class="asset"><div><b>' + esc(a.label) + "</b><small>" + esc(a.note || "") + '</small></div><a class="dl" href="' + esc(a.url) + '" download="' + esc(fileName(a.url)) + '">' + DL + "Download</a></div>").join("") + "</div>" : "")));
  }

  /* ---------- Fact sheet + coverage ---------- */
  const F = K.facts || [];
  const CV = K.coverage || [];
  if (F.length || CV.length) {
    nav.push({ id: "facts", title: "Fact sheet" });
    html.push(
      '<section class="block" id="facts"><div class="wrap"><div class="two">' +
        (F.length ? '<div><div class="label"><h2>Fact sheet</h2></div><dl class="facts">' + F.map(f => "<div><dt>" + esc(f.k) + "</dt><dd>" + esc(f.v) + "</dd></div>").join("") + "</dl></div>" : "") +
        (CV.length ? '<div><div class="label"><h2>Coverage</h2></div><div class="coverage">' + CV.map(c => '<a href="' + esc(c.url) + '" target="_blank" rel="noopener"><small>' + esc(c.outlet) + "</small><span>" + esc(c.title) + "</span></a>").join("") + "</div></div>" : "") +
      "</div></div></section>"
    );
  }

  /* ---------- Links ---------- */
  const order = ["spotify", "appleMusic", "youtube", "instagram", "tiktok", "facebook", "x", "threads", "bandsintown", "website"];
  const lk = order.map(t => byType[t]).filter(Boolean);
  if (lk.length || artist.page) {
    html.push(section("links", "Links",
      '<div class="links">' +
        (artist.page ? '<a href="' + esc(pageLink) + '">' + icon("website") + "Artist page</a>" : "") +
        lk.map(l => '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + icon(l.type) + esc(label(l)) + "</a>").join("") +
      "</div>"));
  }

  /* ---------- Contacts ---------- */
  const C = K.contacts || [];
  if (C.length) {
    html.push(section("contact", "Contact",
      '<div class="contacts">' + C.map(c => '<a class="contact" href="mailto:' + esc(c.email) + '"><span>' + esc(c.role) + "</span><b>" + esc(c.name) + "</b><small>" + esc(c.email) + "</small></a>").join("") + "</div>"));
  }

  html.push('<footer class="site"><a href="/">Bedrock Music</a> &middot; &copy; ' + new Date().getFullYear() + "</footer>");

  const bar = '<div class="bar"><div class="wrap"><a class="brand" href="/">Bedrock &middot; ' + esc(artist.name) + "</a><nav>" +
    nav.map(n => '<a href="#' + n.id + '">' + esc(n.title) + "</a>").join("") + "</nav></div></div>";
  app.innerHTML = bar + html.join("");

  /* ---------- Behaviour ---------- */
  const toast = document.getElementById("toast");
  const flash = t => { toast.textContent = t; toast.classList.add("on"); setTimeout(() => toast.classList.remove("on"), 1500); };
  document.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
    const text = b.dataset.copy === "short" ? K.shortBio : bio.join("\n\n");
    try { await navigator.clipboard.writeText(text); flash("Bio copied"); } catch (e) { flash("Select and copy"); }
  }));

  const play = document.getElementById("play-here");
  if (play) play.addEventListener("click", () => {
    document.getElementById("embed-slot").innerHTML =
      '<iframe src="' + esc(M.spotifyEmbed) + '" height="352" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" title="Spotify player"></iframe>';
  });

  document.querySelectorAll(".video").forEach(v => v.addEventListener("click", () => {
    v.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + esc(v.dataset.id) + '?autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Video"></iframe>';
  }, { once: true }));
})();
</script>
</body>
</html>
